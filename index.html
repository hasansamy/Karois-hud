<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KAIROS · Operational Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,600&family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-mesh: radial-gradient(at 10% 20%, rgba(56, 189, 248, 0.18) 0px, transparent 50%),
               radial-gradient(at 90% 10%, rgba(251, 191, 36, 0.16) 0px, transparent 50%),
               radial-gradient(at 50% 90%, rgba(99, 102, 241, 0.14) 0px, transparent 50%),
               #edf3f8;
    --glass: rgba(255, 255, 255, 0.84);
    --glass-card: rgba(255, 255, 255, 0.95);
    --border: rgba(14, 165, 233, 0.32);
    --border-subtle: rgba(15, 23, 42, 0.1);
    --primary: #0284c7;
    --primary-glow: rgba(2, 132, 199, 0.35);
    --text-main: #09131f;
    --text-muted: #334155;
    --text-sub: #64748b;
    --accent-emerald: #059669;
    --accent-amber: #d97706;
    --accent-crimson: #dc2626;
    --font-head: 'Chakra Petch', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'Space Grotesk', sans-serif;
    --shadow-hologram: 0 16px 40px -8px rgba(14, 165, 233, 0.18), 0 2px 10px rgba(0,0,0,0.03);
  }

  body.pm-mode {
    --bg-mesh: radial-gradient(at 20% 20%, rgba(245, 158, 11, 0.15) 0px, transparent 50%),
               radial-gradient(at 80% 80%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
               #020408;
    --glass: rgba(9, 13, 20, 0.88);
    --glass-card: rgba(13, 19, 30, 0.94);
    --border: rgba(245, 158, 11, 0.32);
    --border-subtle: rgba(255, 255, 255, 0.09);
    --primary: #f59e0b;
    --primary-glow: rgba(245, 158, 11, 0.4);
    --text-main: #f8fafc;
    --text-muted: #cbd5e1;
    --text-sub: #94a3b8;
    --accent-emerald: #10b981;
    --accent-amber: #fbbf24;
    --accent-crimson: #ef4444;
    --shadow-hologram: 0 20px 50px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 158, 11, 0.15);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    overflow-x: hidden;
    width: 100%;
    max-width: 100vw;
  }

  body {
    background: var(--bg-mesh);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.3s ease;
    padding-bottom: 60px;
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .holo-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: linear-gradient(var(--border-subtle) 1px, transparent 1px),
                      linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
    background-size: 36px 36px;
    z-index: 1;
    opacity: 0.65;
  }

  .hud-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-x: hidden;
  }

  .holo-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 14px 22px;
    border-radius: 16px;
    box-shadow: var(--shadow-hologram);
    width: 100%;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .system-node {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 16px var(--primary);
    animation: pulseNode 2.5s infinite;
  }
  .system-title {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1.5px;
    color: var(--text-main);
  }

  .switch-dock {
    display: flex;
    background: rgba(0, 0, 0, 0.06);
    border: 1px solid var(--border-subtle);
    padding: 4px;
    border-radius: 30px;
    gap: 6px;
    z-index: 20;
  }
  body.pm-mode .switch-dock {
    background: rgba(255, 255, 255, 0.05);
  }
  .dock-btn {
    background: transparent;
    border: none;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 800;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s ease;
    touch-action: manipulation;
  }
  .dock-btn.active {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 4px 15px var(--primary-glow);
  }
  body.pm-mode .dock-btn.active {
    color: #03060a;
  }

  .nav-right {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .commute-banner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
  }
  .commute-card {
    background: var(--glass-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow-hologram);
  }
  .commute-info-title {
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .commute-info-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .commute-badge {
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    text-align: right;
  }

  .hero-hologram {
    background: var(--glass-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 34px;
    box-shadow: var(--shadow-hologram);
    position: relative;
    overflow: hidden;
    width: 100%;
  }
  .hero-hologram::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
  }
  .hero-quote {
    font-family: var(--font-sans);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text-main);
    font-style: italic;
    max-width: 950px;
  }
  .hero-author {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    margin-top: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .metric-deck {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    width: 100%;
  }
  .metric-card {
    background: var(--glass-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: var(--shadow-hologram);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .metric-label {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .metric-val {
    font-family: var(--font-head);
    font-size: 26px;
    font-weight: 700;
    color: var(--text-main);
  }
  .metric-val.emerald { color: var(--accent-emerald); }
  .metric-val.amber { color: var(--accent-amber); }
  .metric-val.cyan { color: var(--primary); }
  .metric-val.crimson { color: var(--accent-crimson); }

  .mag-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mag-bubble {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    transition: all 0.2s ease;
  }
  .mag-bubble.checked {
    border-color: var(--accent-emerald);
    background: rgba(16, 185, 129, 0.2);
    color: var(--accent-emerald);
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
  }

  .main-deck {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 20px;
    width: 100%;
  }
  .deck-pane {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    min-width: 0;
  }

  .holo-panel {
    background: var(--glass-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow-hologram);
    width: 100%;
    overflow: hidden;
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  .panel-title {
    font-family: var(--font-head);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-tag {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
  }

  .hydro-tracker {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }
  .hydro-segments {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
  }
  .hydro-block {
    background: rgba(0,0,0,0.03);
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    touch-action: manipulation;
  }
  body.pm-mode .hydro-block {
    background: rgba(255,255,255,0.03);
  }
  .hydro-block.active {
    background: rgba(2, 132, 199, 0.16);
    border: 2px solid var(--primary);
    box-shadow: 0 0 16px var(--primary-glow);
  }
  body.pm-mode .hydro-block.active {
    background: rgba(245, 158, 11, 0.18);
    border-color: var(--primary);
  }
  .hydro-block-vol {
    font-family: var(--font-head);
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
  }
  .hydro-block-lbl {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 3px;
  }
  .hydro-status {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--primary);
    font-weight: 700;
  }

  .tracker-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
    width: 100%;
  }
  .habit-pill {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.2s ease;
    touch-action: manipulation;
    min-width: 0;
  }
  .habit-pill.checked {
    border-color: var(--accent-emerald);
    background: rgba(16, 185, 129, 0.15);
  }
  .habit-name {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .habit-check-icon {
    font-size: 14px;
    color: var(--text-sub);
    font-weight: 800;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .habit-pill.checked .habit-check-icon {
    color: var(--accent-emerald);
  }

  .rating-wrapper {
    margin-top: 14px;
    width: 100%;
    overflow: hidden;
  }
  .rating-label {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-sub);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .rating-row {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    width: 100%;
  }
  .rate-btn {
    width: 100%;
    min-width: 0;
    height: 38px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .rate-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #020408;
    box-shadow: 0 0 10px var(--primary-glow);
  }

  .submit-dock {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    width: 100%;
  }
  .sync-btn {
    flex-grow: 1;
    background: var(--primary);
    border: none;
    color: #020408;
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 700;
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    touch-action: manipulation;
  }
  .sync-btn:active {
    transform: scale(0.98);
  }
  .sheet-link-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    padding: 11px 14px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .sync-status-msg {
    font-family: var(--font-mono);
    font-size: 12px;
    margin-top: 8px;
    color: var(--accent-emerald);
    display: none;
  }

  .breath-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 0 10px 0;
    width: 100%;
  }
  .breath-sphere {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-amber), rgba(245, 158, 11, 0.2));
    box-shadow: 0 0 35px var(--accent-amber);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #020408;
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    animation: breatheAnim 19s infinite ease-in-out;
  }
  .breath-caption {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent-amber);
    margin-top: 18px;
    letter-spacing: 0.5px;
  }

  .inbox-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }
  .email-item {
    background: rgba(0, 0, 0, 0.02);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.25s ease;
    width: 100%;
  }
  body.pm-mode .email-item {
    background: rgba(255, 255, 255, 0.03);
  }
  .email-header-row {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    gap: 14px;
    touch-action: manipulation;
  }
  .email-summary {
    flex-grow: 1;
    min-width: 0;
  }
  .email-sender {
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
  }
  .email-subject {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .email-meta-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .expand-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--primary);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    pointer-events: none;
  }
  .email-dismiss {
    background: transparent;
    border: 1px solid var(--border-subtle);
    color: var(--text-sub);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s ease;
    touch-action: manipulation;
    z-index: 25;
  }
  .email-dismiss:hover, .email-dismiss:active {
    border-color: var(--accent-crimson);
    color: var(--accent-crimson);
    background: rgba(220, 38, 38, 0.15);
    transform: scale(1.15);
  }

  .email-drawer {
    display: none;
    padding: 0 18px 16px 18px;
    border-top: 1px solid var(--border-subtle);
    background: rgba(0, 0, 0, 0.02);
  }
  body.pm-mode .email-drawer {
    background: rgba(0, 0, 0, 0.3);
  }
  .drawer-body {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-muted);
    padding-top: 12px;
  }
  .drawer-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .drawer-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--primary);
    cursor: pointer;
  }

  .time-block {
    padding: 14px 18px;
    border-left: 4px solid var(--primary);
    background: rgba(0,0,0,0.02);
    border-radius: 0 12px 12px 0;
    margin-bottom: 12px;
  }
  body.pm-mode .time-block {
    background: rgba(255,255,255,0.02);
  }
  .time-block.emerald { border-left-color: var(--accent-emerald); }
  .time-block.amber { border-left-color: var(--accent-amber); }
  .time-block.cyan { border-left-color: var(--primary); }
  .time-block.violet { border-left-color: #8b5cf6; }
  .time-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-main);
  }
  .time-meta {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.4;
  }

  .radar-row {
    padding: 14px 18px;
    background: rgba(0,0,0,0.02);
    border-radius: 12px;
    border: 1px solid var(--border-subtle);
    margin-bottom: 12px;
  }
  body.pm-mode .radar-row {
    background: rgba(255,255,255,0.02);
  }
  .radar-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
  }
  .radar-pill-red {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    background: rgba(220, 38, 38, 0.15);
    color: var(--accent-crimson);
    border: 1px solid rgba(220, 38, 38, 0.3);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .radar-desc {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.45;
  }

  .pm-only { display: none !important; }
  .am-only { display: block !important; }
  body.pm-mode .am-only { display: none !important; }
  body.pm-mode .pm-only { display: block !important; }

  body.pm-mode .pm-only.metric-card { display: flex
