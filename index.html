<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KAIROS · Operational Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,600&family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-mesh: radial-gradient(at 10% 20%, rgba(56, 189, 248, 0.18) 0px, transparent 50%),
               radial-gradient(at 90% 10%, rgba(251, 191, 36, 0.16) 0px, transparent 50%),
               radial-gradient(at 50% 90%, rgba(99, 102, 241, 0.14) 0px, transparent 50%),
               #edf3f8;
    --glass: rgba(255, 255, 255, 0.84);
    --glass-card: rgba(255, 255, 255, 0.95);
    --border: rgba(14, 165, 233, 0.32);
    --border-subtle: rgba(15, 23, 42, 0.1);
    --primary: #0284c7;
    --primary-glow: rgba(2, 132, 199, 0.35);
    --text-main: #09131f;
    --text-muted: #334155;
    --text-sub: #64748b;
    --accent-emerald: #059669;
    --accent-amber: #d97706;
    --accent-crimson: #dc2626;
    --font-head: 'Chakra Petch', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'Space Grotesk', sans-serif;
    --shadow-hologram: 0 16px 40px -8px rgba(14, 165, 233, 0.18), 0 2px 10px rgba(0,0,0,0.03);
  }

  body.pm-mode {
    --bg-mesh: radial-gradient(at 20% 20%, rgba(245, 158, 11, 0.15) 0px, transparent 50%),
               radial-gradient(at 80% 80%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
               #020408;
    --glass: rgba(9, 13, 20, 0.88);
    --glass-card: rgba(13, 19, 30, 0.94);
    --border: rgba(245, 158, 11, 0.32);
    --border-subtle: rgba(255, 255, 255, 0.09);
    --primary: #f59e0b;
    --primary-glow: rgba(245, 158, 11, 0.4);
    --text-main: #f8fafc;
    --text-muted: #cbd5e1;
    --text-sub: #94a3b8;
    --accent-emerald: #10b981;
    --accent-amber: #fbbf24;
    --accent-crimson: #ef4444;
    --shadow-hologram: 0 20px 50px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 158, 11, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-mesh);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.3s ease;
    padding-bottom: 60px;
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .holo-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: linear-gradient(var(--border-subtle) 1px, transparent 1px),
                      linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
    background-size: 36px 36px;
    z-index: 1;
    opacity: 0.65;
  }

  .hud-wrapper {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .holo-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 14px 22px;
    border-radius: 16px;
    box-shadow: var(--shadow-hologram);
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .system-node {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 16px var(--primary);
    animation: pulseNode 2.5s infinite;
  }
  .system-title {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1.5px;
    color: var(--text-main);
  }

  .switch-dock {
    display: flex;
    background: rgba(0, 0, 0, 0.06);
    border: 1px solid var(--border-subtle);
    padding: 4px;
    border-radius: 30px;
    gap: 6px;
    z-index: 20;
  }
  body.pm-mode .switch-dock {
    background: rgba(255, 255, 255, 0.05);
  }
  .dock-btn {
    background: transparent;
    border: none;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 800;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s ease;
    touch-action: manipulation;
  }
  .dock-btn.active {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 4px 15px var(--primary-glow);
  }
  body.pm-mode .dock-btn.active {
    color: #03060a;
  }

  .nav-right {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .commute-banner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .commute-card {
    background: var(--glass-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow-hologram);
  }
  .commute-info-title {
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .commute-info-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .commute-badge {
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    text-align: right;
  }

  .hero-hologram {
    background: var(--glass-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 34px;
    box-shadow: var(--shadow-hologram);
    position: relative;
    overflow: hidden;
  }
  .hero-hologram::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
  }
  .hero-quote {
    font-family: var(--font-sans);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text-main);
    font-style: italic;
    max-width: 950px;
  }
  .hero-author {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    margin-top: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .metric-deck {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .metric-card {
    background: var(--glass-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: var(--shadow-hologram);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .metric-label {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .metric-val {
    font-family: var(--font-head);
    font-size: 26px;
    font-weight: 700;
    color: var(--text-main);
  }
  .metric-val.emerald { color: var(--accent-emerald); }
  .metric-val.amber { color: var(--accent-amber); }
  .metric-val.cyan { color: var(--primary); }
  .metric-val.crimson { color: var(--accent-crimson); }

  .mag-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mag-bubble {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor
